[project]
name = "quarry-ldr"
version = "0.1.0"
description = "Hybrid local/API deep research: a local GPU compresses the web into dense evidence, Claude reasons over it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vignesh Nagarajan" }]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "rich>=13.9",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "protego>=0.3",
    "anthropic>=0.42",
    "aiosqlite>=0.20",
    "lancedb>=0.17",
    "pyarrow>=18",
    "numpy>=1.26",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# GPU stack is optional so CI and CPU-only test runs never pull torch.
gpu = [
    "torch>=2.7",
    "sentence-transformers>=3.3",
    "transformers>=4.47",
]

[project.scripts]
quarry = "quarry_ldr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry_ldr"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default selection is CPU-only and network-blocked. Real hardware and live
# network/API tests are opt-in via -m gpu / -m live.
addopts = "-m \"not gpu and not live\" --disable-socket --allow-hosts=127.0.0.1,::1 --cov=quarry_ldr --cov-report=term-missing --cov-fail-under=80"
markers = [
    "gpu: requires a real NVIDIA GPU (deselected by default)",
    "live: requires network and/or an API key (deselected by default)",
]

[tool.coverage.run]
source = ["quarry_ldr"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quarry_ldr"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "lancedb.*",
    "protego.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "pytest_socket.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The CLI layer and standalone scripts are the only places print/console output is allowed.
"src/quarry_ldr/cli.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
