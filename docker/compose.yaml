# Local SearXNG metasearch instance with JSON output enabled.
# Start with `make searxng` (which checks that Docker is installed and running
# and prints exact remediation if not) or directly:
#   docker compose -f docker/compose.yaml up -d
services:
  searxng:
    image: searxng/searxng:latest
    container_name: quarry-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Local-only instance secret; not a credential. SearXNG refuses to start
      # without one. Override with a random value if you ever expose the port.
      - SEARXNG_SECRET=quarry-ldr-local-only
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
