# Minimal SearXNG settings for Quarry-LDR.
# The one non-default that matters: the json format must be enabled, otherwise
# the API returns 403 for format=json and the search client fails with a
# remediation message pointing here.
use_default_settings: true

server:
  limiter: false
  public_instance: false

# Throttled engines answer slowly before they answer not at all; the default
# 3 s per-engine timeout turns throttling into empty result sets.
outgoing:
  request_timeout: 6.0

search:
  formats:
    - html
    - json
